<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS — Footer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="footer__container">

            <div class="footer__top">
                <!-- Logo -->
                <a href="#" class="footer__logo">
                    <img class="footer__logo-img" src="images-icons/footer/logo.png" alt="SOS">
                </a>

                <!-- Navigation -->
                <nav class="footer__nav">
                    <a href="#" class="footer__nav-link">MAIN</a>
                    <a href="#" class="footer__nav-link">ABOUT</a>
                    <a href="#" class="footer__nav-link">GAME FEATURES</a>
                    <a href="#" class="footer__nav-link">SYSTEM REQUIREMENTS</a>
                    <a href="#" class="footer__nav-link">QUOTES</a>
                </nav>

                <!-- Social icons -->
                <div class="footer__socials">
                    <a href="#" class="footer__social-link" aria-label="Facebook">
                        <img src="images-icons/footer/facebook.svg" alt="Facebook">
                    </a>
                    <a href="#" class="footer__social-link" aria-label="Twitter">
                        <img src="images-icons/footer/twitter.svg" alt="Twitter">
                    </a>
                    <a href="#" class="footer__social-link" aria-label="YouTube">
                        <img src="images-icons/footer/Vector.svg" alt="YouTube">
                    </a>
                    <a href="#" class="footer__social-link" aria-label="Twitch">
                        <img src="images-icons/footer/twitch.svg" alt="Twitch">
                    </a>
                </div>
            </div>

            <!-- Divider -->
            <div class="footer__divider" role="presentation"></div>

            <!-- Bottom row: copyright | legal links -->
            <div class="footer__bottom">
                <p class="footer__copyright">&copy; 2018 Outpost Games, Inc. All Rights Reserved</p>
                <div class="footer__legal">
                    <a href="#" class="footer__legal-link">PRIVACY POLICY</a>
                    <span class="footer__legal-sep" aria-hidden="true">|</span>
                    <a href="#" class="footer__legal-link">TERMS OF SERVICES</a>
                    <span class="footer__legal-sep" aria-hidden="true">|</span>
                    <a href="#" class="footer__legal-link">CODE OF CONDUCT</a>
                </div>
            </div>

        </div>
    </footer>

</body>
</html>
